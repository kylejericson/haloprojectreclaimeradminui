# Add this service under the existing czechhalo stack's `services:` section.
# It shares the server folder and host network so it can use loopback RCON.
  admin-ui:
    build: ./admin-ui
    restart: unless-stopped
    network_mode: host
    user: "65534:65534"
    env_file:
      - ./admin-ui.env
    environment:
      SERVER_DIR: /server
      BIND_HOST: 0.0.0.0
      PORT: 8780
      COOKIE_SECURE: "false"
    volumes:
      - ./server:/server
      - steamcmd-data:/opt/steamcmd
      - steamcmd-home:/home/steamcmd

# Add these two volume lines to every Reclaimer server service too:
#
#     volumes:
#       - steamcmd-data:/opt/steamcmd
#       - steamcmd-home:/home/steamcmd
#
# Also add this to each server service so admin-ui seeds the SteamCMD volume
# from its image on the first start:
#
#     depends_on:
#       admin-ui:
#         condition: service_started
#
# Keep these top-level volume declarations in the full Compose file.
volumes:
  steamcmd-data:
  steamcmd-home:
