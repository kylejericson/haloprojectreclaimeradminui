services:
  reclaimer-control:
    build: .
    restart: unless-stopped
    # Linux host networking lets the panel reach RCON bound to 127.0.0.1.
    network_mode: host
    user: "${PUID:-65534}:${PGID:-65534}"
    environment:
      SERVER_DIR: /server
      ADMIN_PASSWORD: "${ADMIN_PASSWORD:?Set ADMIN_PASSWORD in .env}"
      BIND_HOST: "${BIND_HOST:-127.0.0.1}"
      PORT: "${PORT:-8780}"
      COOKIE_SECURE: "${COOKIE_SECURE:-false}"
    volumes:
      - "${SERVER_DIR_HOST:?Set SERVER_DIR_HOST in .env}:/server"
      - steamcmd-data:/opt/steamcmd
      - steamcmd-home:/home/steamcmd

volumes:
  steamcmd-data:
  steamcmd-home:
